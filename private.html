<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الثانوية الثانية والأربعون – مسارات</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="site" src="index-live-backup.html" title="الثانوية الثانية والأربعون"></iframe>
<script>
(function(){
  const f=document.getElementById('site');
  function add(){
    try{
      const doc=f.contentDocument;
      if(!doc)return;
      if(doc.getElementById('schoolAchievementsNote'))return;
      const els=[...doc.querySelectorAll('p')];
      const el=els.find(e=>e.textContent.includes('مديرة المدرسة:'));
      if(!el)return;
      const note=doc.createElement('div');
      note.id='schoolAchievementsNote';
      note.textContent='الموقع خاص لعرض إنجازات المدرسة';
      note.style.cssText='margin:4px 0 0;font-size:.78rem;color:#6b4aa1;font-weight:600;text-align:center;';
      el.insertAdjacentElement('afterend',note);
    }catch(e){}
  }
  f.addEventListener('load',()=>{add();setTimeout(add,500);setTimeout(add,1500);});
})();
</script>
</body>
</html>
