<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>الثانوية الثانية والأربعون</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff}body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#4b3864}.loading{font-size:18px}</style>
</head>
<body>
<div class="loading">جاري تحميل الموقع…</div>
<script>
(async function(){
  const url='https://raw.githubusercontent.com/iemohammedal-netizen/Noura-File/1a15857123f95f4f986d9a8eef9ed68a8317674e/index.html';
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.querySelector('.loading').textContent='تعذر تحميل الموقع. أغلقي الصفحة وافتحي الرابط مرة أخرى.';
  }
})();
</script>
</body>
</html>
