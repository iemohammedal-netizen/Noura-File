<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>الصفحة مغلقة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f7f2fb,#ece6f5);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#4b3864}.card{width:min(620px,100%);padding:48px 28px;text-align:center;background:#fff;border-radius:28px;box-shadow:0 18px 60px rgba(70,50,95,.15)}.icon{font-size:56px;margin-bottom:16px}h1{margin:0 0 14px;font-size:36px}p{margin:0;color:#6d6378;font-size:19px;line-height:1.9}
</style>
</head>
<body><main class="card"><div class="icon">🔒</div><h1>الصفحة مغلقة</h1><p>تم إغلاق الصفحة الرئيسية للموقع حاليًا.</p></main>
<div id="siteVisitorCounter" dir="rtl" style="margin:18px auto 8px;max-width:680px;border-radius:22px;padding:16px 20px;background:linear-gradient(135deg,#5d3b8f,#7a55ad);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 10px 30px rgba(93,59,143,.16);font-family:inherit;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:26px;">👥</span>
    <div>
      <div style="font-size:15px;font-weight:800;">زيارات الموقع</div>
      <div style="font-size:11px;opacity:.78;">يتحدث تلقائيًا</div>
    </div>
  </div>
  <strong id="visitorCount" style="font-size:28px;line-height:1;letter-spacing:.5px;">—</strong>
</div>
<script>
(function(){
  const endpoint='https://counterapi.com/api/42schools.com/view/homepage';
  const el=document.getElementById('visitorCount');
  async function refresh(url){
    try{
      const r=await fetch(url,{cache:'no-store'});
      const d=await r.json();
      if(d && typeof d.value!=='undefined') el.textContent=Number(d.value).toLocaleString('ar-SA');
    }catch(e){}
  }
  refresh(endpoint);
  setInterval(function(){ refresh(endpoint+'?readOnly=true'); },15000);
})();
</script>
</body>
</html>
