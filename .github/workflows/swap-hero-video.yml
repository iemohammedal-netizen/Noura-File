name: Swap main hero video

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace first video source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          target = "assets/intro-school.mp4"
          m = re.search(r"<video\b[^>]*>.*?</video\s*>", s, re.I | re.S)
          if not m:
              raise SystemExit("No video element found in index.html")
          block = m.group(0)
          if target in block:
              print("Hero video already uses target")
              raise SystemExit(0)
          newblock, n = re.subn(r"(\bsrc\s*=\s*[\"'])[^\"']+([\"'])", lambda x: x.group(1)+target+x.group(2), block, count=1, flags=re.I)
          if n == 0:
              newblock, n = re.subn(r"(<video\b)([^>]*?)>", lambda x: x.group(1)+x.group(2)+' src="'+target+'">', block, count=1, flags=re.I|re.S)
          if n == 0:
              raise SystemExit("Could not find video src")
          s = s[:m.start()] + newblock + s[m.end():]
          p.write_text(s, encoding="utf-8")
          print("Updated first video element")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Set main hero video"
          git pull --rebase origin main
          git push
