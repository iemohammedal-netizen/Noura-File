name: Update announcements now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put the two images in the announcements section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          gallery_re = re.compile(r'<div id="latest-news-gallery".*?</div>\s*', re.S)
          m = gallery_re.search(s)
          if not m:
              raise SystemExit("Existing image gallery was not found in index.html")

          gallery = m.group(0)
          s = s[:m.start()] + s[m.end():]

          # Find the actual announcements section by its heading text.
          headings = ["الإعلانات المدرسية", "الإعلانات", "إعلانات"]
          pos = next((s.find(h) for h in headings if s.find(h) >= 0), -1)
          if pos < 0:
              raise SystemExit("Announcements heading not found")

          sec_start = s.rfind("<section", 0, pos)
          sec_end = s.find("</section>", pos)
          if sec_start < 0 or sec_end < 0:
              raise SystemExit("Announcements section boundaries not found")
          sec_end += len("</section>")

          s = s[:sec_end] + "\n" + gallery + s[sec_end:]
          p.write_text(s, encoding="utf-8")
          print("Announcements gallery inserted successfully")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Place announcement images in announcements section"
          git push
