name: Fix announcement image display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix news image sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old1 = ".ncard .ph{display:block;height:180px;overflow:hidden;position:relative;background:#f3f0fa}"
          new1 = ".ncard .ph{display:block;overflow:hidden;position:relative;background:#f3f0fa}"
          old2 = ".ncard .ph img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}"
          new2 = ".ncard .ph img{width:100%;height:auto;display:block;object-fit:contain;object-position:top;transition:transform .5s}"
          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True
          if not changed:
              raise SystemExit("Target news image CSS was not found")
          p.write_text(s, encoding="utf-8")
          print("News image CSS fixed")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show full announcement images"
          git push
