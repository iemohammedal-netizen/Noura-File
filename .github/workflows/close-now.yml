name: Close Website Now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close public homepage
        run: |
          if [ -f index-live-backup.html ]; then exit 0; fi
          cp index.html index-live-backup.html
          cat > index.html <<'EOF'
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تم إغلاق الموقع</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4d1d8f,#7a55ad);color:#fff;text-align:center;padding:24px}.card{width:min(680px,100%);padding:55px 28px;border-radius:28px;background:rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{margin:0 0 18px;font-size:clamp(34px,7vw,58px);font-weight:900}p{margin:0;font-size:clamp(18px,3.5vw,25px);line-height:1.8}.school{margin-top:30px;font-size:15px;opacity:.75}
</style></head>
<body><main class="card"><div style="font-size:64px">🔒</div><h1>تم إغلاق الموقع</h1><p>الموقع مغلق مؤقتًا للزوار.</p><div class="school">الثانوية الثانية والأربعون – مسارات</div></main></body></html>
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-live-backup.html
          git commit -m "Close website temporarily for visitors"
          git push