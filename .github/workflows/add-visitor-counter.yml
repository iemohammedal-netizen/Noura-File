name: Add live visitor counter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visitor counter
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          if "siteVisitorCounter" in html:
              print("Visitor counter already installed.")
              raise SystemExit(0)

          card = r'''
          <div id="siteVisitorCounter" dir="rtl" style="margin:18px auto 8px;max-width:680px;border-radius:22px;padding:16px 20px;background:linear-gradient(135deg,#5d3b8f,#7a55ad);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 10px 30px rgba(93,59,143,.16);font-family:inherit;">
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:26px;">👥</span>
              <div>
                <div style="font-size:15px;font-weight:800;">زيارات الموقع</div>
                <div style="font-size:11px;opacity:.78;">يتحدث تلقائيًا</div>
              </div>
            </div>
            <strong id="visitorCount" style="font-size:28px;line-height:1;letter-spacing:.5px;">—</strong>
          </div>
          <script>
          (function(){
            const endpoint='https://counterapi.com/api/42schools.com/view/homepage';
            const el=document.getElementById('visitorCount');
            async function refresh(url){
              try{
                const r=await fetch(url,{cache:'no-store'});
                const d=await r.json();
                if(d && typeof d.value!=='undefined') el.textContent=Number(d.value).toLocaleString('ar-SA');
              }catch(e){}
            }
            refresh(endpoint);
            setInterval(function(){ refresh(endpoint+'?readOnly=true'); },15000);
          })();
          </script>
          '''

          # Prefer the section containing the existing "أرقام من مدرستنا" heading.
          marker = "أرقام من مدرستنا"
          pos = html.find(marker)

          if pos != -1:
              sec_start = html.rfind("<section", 0, pos)
              sec_end = html.find("</section>", pos)
              if sec_start != -1 and sec_end != -1:
                  html = html[:sec_end] + card + html[sec_end:]
              else:
                  body = html.find("<body")
                  body_end = html.find(">", body)
                  html = html[:body_end+1] + card + html[body_end+1:]
          else:
              body_end = html.find("</body>")
              html = html[:body_end] + card + html[body_end:]

          p.write_text(html, encoding="utf-8")
      - name: Commit counter
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add live visitor counter"
          git push
